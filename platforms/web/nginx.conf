# Пример для собственного сервера (nginx). Сайт обязательно по HTTPS: без него не работают микрофон и офлайн-режим.
server {
  listen 443 ssl http2;
  server_name tabstudio.example.com;
  root /var/www/tabstudio;          # содержимое platforms/web/dist
  index index.html;
  # ssl_certificate ...; ssl_certificate_key ...;

  types { application/manifest+json webmanifest; }
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https://YOUR-PROJECT.supabase.co wss://YOUR-PROJECT.supabase.co; frame-ancestors 'none'" always;
  add_header Permissions-Policy "microphone=(self)" always;
  add_header X-Content-Type-Options nosniff always;

  location = /sw.js      { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /config.js  { add_header Cache-Control "no-cache"; }
  location ~* \.(js|css|woff2|png|svg)$ { add_header Cache-Control "public, max-age=604800"; }
  location / { try_files $uri $uri/ /index.html; }
}
